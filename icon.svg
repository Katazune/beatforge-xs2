<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA222D" />
      <stop offset="55%" stop-color="#7A0C14" />
      <stop offset="100%" stop-color="#10335C" />
    </linearGradient>
  </defs>
  <!-- Outer App Icon Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#chassisGrad)" />
  <!-- Inner Hardware Bezel -->
  <rect x="44" y="44" width="424" height="424" rx="56" fill="#151515" stroke="#D43845" stroke-width="8" />
  <!-- Top Header Brand Text -->
  <text x="76" y="102" fill="#FFCDD2" font-family="monospace" font-weight="bold" font-size="26">BEATFORGE</text>
  <rect x="352" y="74" width="78" height="34" rx="6" fill="#FFFFFF" />
  <text x="391" y="99" text-anchor="middle" fill="#820E17" font-family="sans-serif" font-weight="900" font-size="24">XS2</text>

  <!-- Left: XY Kaoss Pad -->
  <rect x="72" y="128" width="188" height="156" rx="14" fill="#080808" stroke="#38BDF8" stroke-width="4" />
  <line x1="72" y1="198" x2="260" y2="198" stroke="#FF3B30" stroke-width="4" stroke-opacity="0.6" />
  <line x1="176" y1="128" x2="176" y2="284" stroke="#FF3B30" stroke-width="4" stroke-opacity="0.6" />
  <circle cx="176" cy="198" r="22" fill="#FF3B30" fill-opacity="0.45" />
  <circle cx="176" cy="198" r="8" fill="#FFFFFF" />

  <!-- Right: Large Hardware Rotary Knob -->
  <circle cx="364" cy="206" r="68" fill="#2B2B2B" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="364" cy="206" r="46" fill="#121212" stroke="#444444" stroke-width="3" />
  <line x1="364" y1="206" x2="404" y2="156" stroke="#FFD166" stroke-width="10" stroke-linecap="round" />

  <!-- Bottom Row: 4 Illuminated RGB Trigger Pads -->
  <rect x="72" y="318" width="82" height="96" rx="12" fill="#E11D48" stroke="#FFFFFF" stroke-width="4" />
  <rect x="168" y="318" width="82" height="96" rx="12" fill="#9333EA" stroke="#E9D5FF" stroke-width="4" />
  <rect x="264" y="318" width="82" height="96" rx="12" fill="#0284C7" stroke="#BAE6FD" stroke-width="4" />
  <rect x="360" y="318" width="82" height="96" rx="12" fill="#10B981" stroke="#A7F3D0" stroke-width="4" />
</svg>
